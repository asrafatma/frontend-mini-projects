<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Visual Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h1>Custom Visual Changer</h1>
        <p>Welcome to the Custom Visual Changer!</p>

        <div class="css-controller">

            <label for="base-color">Base Color:</label>
            <input type="color" id="base-color" name="base-color" value="#ffffff">

            <label for="text-color">Text Color:</label>
            <input type="color" id="text-color" name="text-color" value="#000000">

            <label for="font-size">Font Size:</label>
            <input type="range" id="font-size" name="font-size" value="16" min="8" max="72">

            <label for="width">Width:</label>
            <input type="range" id="width" name="width" value="50" min="1" max="100" data-sizing="%">

            <label for="border-radius">Border Radius:</label>
            <input type="range" id="border-radius" name="border-radius" value="5" min="0" max="50" data-sizing="px">

            <label for="padding">Padding:</label>
            <input type="range" id="padding" name="padding" value="10" min="0" max="50" data-sizing="px">

            <label for="blur">Blur:</label>
            <input type="range" id="blur" name="blur" value="0" min="0" max="20" data-sizing="px">
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

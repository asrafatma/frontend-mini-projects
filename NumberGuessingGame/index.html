<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
            <label id="label" for="input">Guess a number between 1 to 100:</label>
            <br><br>
            <input type="number" id="input" min="1" max="100" placeholder="Enter number...">
            <button id="button">Submit</button>
    <script src="index.js"></script>
</body>
</html>

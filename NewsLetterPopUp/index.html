<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Letter PopUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="popup-body">
    <a href="javascript:void(0)" class="subscribe" onclick="showPopup()">Subscribe Us</a>

    <div id="popup">
        <h2 id="title">Subscribe to Our Newsletter</h2>
        <p id="description">Get the latest news and updates delivered to your inbox.</p>
        <form>
            <input class="email-input" type="email" placeholder="Enter your email" required>
            <button class="subscribe-button" type="submit">Subscribe</button>

        </form>

        <a href="javascript:void(0)" class="close-button" onclick="hidePopup()">X</a>
    </div>
    <script src="index.js"></script>
</body>
</html>
